name: Test Kupi KUL flight data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Fetch Kupi departures and arrivals
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const airlineNames = {
            AK:'AirAsia', D7:'AirAsia X', FD:'Thai AirAsia', QZ:'Indonesia AirAsia',
            MH:'Malaysia Airlines', OD:'Batik Air Malaysia', ID:'Batik Air',
            SQ:'Singapore Airlines', TR:'Scoot', QR:'Qatar Airways', EK:'Emirates',
            TK:'Turkish Airlines', TG:'Thai Airways', GA:'Garuda Indonesia',
            CX:'Cathay Pacific', JL:'Japan Airlines', NH:'ANA', BI:'Royal Brunei',
            UL:'SriLankan Airlines', WY:'Oman Air', EY:'Etihad Airways',
            SV:'Saudia', CZ:'China Southern', MU:'China Eastern', CA:'Air China',
            KE:'Korean Air', VN:'Vietnam Airlines', PR:'Philippine Airlines',
            KQ:'Kenya Airways', ET:'Ethiopian Airlines', NZ:'Air New Zealand',
            8B:'TransNusa', 5J:'Cebu Pacific', VJ:'VietJet Air'
          };
          const flightRe = /\b([A-Z0-9]{1,3}\s?\d{1,5})\b/g;
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const kind of ['departure','arrival']) {
              const page = await browser.newPage();
              await page.goto('https://www.kupi.com/en/explore/malaysia/kuala-lumpur/kuala-lumpur-international-airport/timetable?direction='+kind, {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForTimeout(10000);
              const rows = await page.evaluate(() => {
                const flightRe = /\b([A-Z0-9]{1,3}\s?\d{1,5})\b/g;
                const candidates = [];
                for (const el of document.querySelectorAll('body *')) {
                  const text = (el.innerText || '').trim();
                  if (!text || text.length > 700 || !el.querySelector('img[alt]')) continue;
                  const flights = [...text.matchAll(flightRe)].map(m=>m[1].replace(/\s+/g,' '));
                  const times = [...text.matchAll(/\b\d{1,2}:\d{2}\b/g)].map(m=>m[0]);
                  const codes = [...text.matchAll(/\b[A-Z]{3}\b/g)].map(m=>m[0]);
                  if (!flights.length || !times.length || !codes.length) continue;
                  candidates.push({text, flights, times, codes, imgs:[...el.querySelectorAll('img[alt]')].map(i=>(i.alt||'').trim()).filter(Boolean)});
                }
                candidates.sort((a,b)=>a.text.length-b.text.length);
                const seen=new Set(), out=[];
                for (const c of candidates) {
                  const flight=c.flights[0];
                  if (seen.has(flight)) continue;
                  const airlineCode=(c.imgs.find(x=>/^[A-Z0-9]{2,3}$/.test(x))||flight.split(' ')[0]).toUpperCase();
                  const lines=c.text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
                  const destinationLine=lines.find(x=>c.codes.some(code=>new RegExp('\\b'+code+'\\b').test(x)) && !/^([A-Z0-9]{1,3}\s?\d{1,5})(,|$)/.test(x)) || c.codes[0];
                  out.push({flight, airlineCode, destination:destinationLine, scheduled:c.times[0]||'', estimated:c.times[1]||''});
                  seen.add(flight);
                }
                return out;
              });
              const cleaned = rows.map(r => ({flight:r.flight, airline:airlineNames[r.airlineCode] || r.airlineCode, destination:r.destination, scheduled:r.scheduled, estimated:r.estimated}));
              fs.writeFileSync('data/kupi-kul-'+(kind==='departure'?'departures':'arrivals')+'.json', JSON.stringify({source:'Kupi', airport:'KUL', updatedAt:new Date().toISOString(), flights:cleaned}, null, 2)+'\n');
              await page.close();
            }
            await browser.close();
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE
      - name: Commit Kupi data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kupi-kul-departures.json data/kupi-kul-arrivals.json
          git commit -m "Update Kupi KUL flight data" || echo "No data changes"
          git push
