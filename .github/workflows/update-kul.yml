name: Update KUL departures

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Fetch Malaysia Airports departures
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            await page.goto('https://airports.malaysiaairports.com.my/en', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(10000);
            const rows = await page.evaluate(() => {
              const text = document.body.innerText;
              const lines = text.split(/\n+/).map(x => x.trim()).filter(Boolean);
              const out = [];
              for (let i=0; i<lines.length; i++) {
                const m = lines[i].match(/^([A-Z0-9]{2,3})\s?(\d{1,5})$/);
                if (!m) continue;
                out.push({flight:m[1]+' '+m[2], airline:lines[i+1]||'', status:lines[i+2]||'', time:lines[i+3]||''});
              }
              return out;
            });
            fs.mkdirSync('data', {recursive:true});
            fs.writeFileSync('data/kul-departures.json', JSON.stringify({updatedAt:new Date().toISOString(), source:'Malaysia Airports', flights:rows}, null, 2));
            await browser.close();
          })();
          NODE
      - name: Publish JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kul-departures.json
          git diff --cached --quiet || git commit -m 'Update KUL departures'
          git push
